name: terraform-ci (reusable)

# Reusable Terraform fmt + validate gate — the SSOT for the IaC correctness gate across the platform repos
# (CZID-310). Callers add a thin wrapper (see README) and pin to a tag (e.g. @v1) so a single change here
# rolls out to every repo. Pure correctness: validate runs -backend=false, so no cloud creds or remote
# state are touched — safe on every PR.
#
# (Converted from the earlier OpenTofu gate — the platform reverted OpenTofu -> native Terraform, #370.)
#
# Inputs let each repo express its shape without forking the gate:
#   fmt_path          - what to `terraform fmt -check -recursive` (default ".")
#   stacks            - newline-separated stack dirs; each gets init(-backend=false)+validate (matrix-free)
#   validate_command  - custom validate, used INSTEAD of `stacks` (e.g. `make validate`, or codegen+root validate)
#   prepare           - optional shell run before fmt (codegen / env setup)
#   check_lockfile    - fail if .terraform.lock.hcl drifted during init (provider-pin gate, CZID-30)
#   terraform_version - Terraform version for hashicorp/setup-terraform (default "latest")

on:
  workflow_call:
    inputs:
      fmt_path:
        type: string
        default: "."
      stacks:
        type: string
        default: ""
      validate_command:
        type: string
        default: ""
      prepare:
        type: string
        default: ""
      check_lockfile:
        type: boolean
        default: false
      terraform_version:
        type: string
        default: "latest"

permissions:
  contents: read

jobs:
  terraform-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Fetch git module sources over HTTPS (public modules; CI has no SSH key)
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: false
      - name: terraform fmt -check
        # Runs on committed files BEFORE prepare, so codegen output (variables.tf, chalice.tf.json, …)
        # is never formatting-gated.
        run: terraform fmt -check -recursive ${{ inputs.fmt_path }}
      - name: Prepare (codegen / setup, if any)
        if: ${{ inputs.prepare != '' }}
        shell: bash
        run: ${{ inputs.prepare }}
      - name: terraform validate (+ optional per-stack lockfile gate, CZID-30)
        shell: bash
        env:
          VALIDATE_COMMAND: ${{ inputs.validate_command }}
          STACKS: ${{ inputs.stacks }}
          CHECK_LOCKFILE: ${{ inputs.check_lockfile }}
        run: |
          set -euo pipefail
          # CZID-30: after init, the stack's .terraform.lock.hcl must be committed and unchanged — so provider
          # versions stay pinned/reproducible and a broken/malicious provider release can't slip in. Checked
          # per-stack for the `stacks` path, at root for the `validate_command` path.
          check_lock() {
            local d="$1" f
            [ "$d" = "." ] && f=".terraform.lock.hcl" || f="$d/.terraform.lock.hcl"
            if [ ! -f "$f" ]; then
              echo "::error::$f is missing — run 'terraform providers lock ...' in '$d' and commit it."; exit 1
            fi
            if ! git diff --exit-code -- "$f"; then
              echo "::error::$f drifted during init — re-run 'terraform providers lock' in '$d' and commit it."; exit 1
            fi
          }
          if [ -n "$VALIDATE_COMMAND" ]; then
            bash -c "$VALIDATE_COMMAND"
            if [ "$CHECK_LOCKFILE" = "true" ]; then check_lock "."; fi
          elif [ -n "$STACKS" ]; then
            while IFS= read -r stack; do
              [ -z "$stack" ] && continue
              echo "== validate $stack =="
              terraform -chdir="$stack" init -backend=false -input=false
              terraform -chdir="$stack" validate
              if [ "$CHECK_LOCKFILE" = "true" ]; then check_lock "$stack"; fi
            done <<< "$STACKS"
          else
            echo "::error::provide either 'stacks' or 'validate_command'"; exit 1
          fi
