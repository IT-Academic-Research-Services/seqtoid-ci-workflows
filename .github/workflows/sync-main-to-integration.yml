name: sync-main-to-integration

# Safety net for the rollup model: `main` is supposed to advance ONLY via rollup-integration-to-main (a
# fast-forward from integration). If something lands on main DIRECTLY (an accidental merge, a hotfix, an
# upstream sync), integration would fall behind and every future rollup would fail the ancestor check. This
# workflow heals that: on any push to main, if integration does not already contain main, it merges main
# back into integration.
#
# NO PING-PONG: after a normal rollup, main == integration, so `main is an ancestor of integration` is true
# and this job exits without pushing. It only pushes when main genuinely has commits integration lacks; once
# integration absorbs them the next rollup no-ops (main == integration). Both directions are guarded by an
# ancestry/equality check, so the pair converges instead of looping.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sync-main-to-integration
  cancel-in-progress: false

jobs:
  sync-back:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration
          token: ${{ secrets.ROLLUP_TOKEN || github.token }}

      - name: Merge main back into integration (only if integration is missing main's commits)
        run: |
          set -euo pipefail
          git fetch origin main integration
          main_sha="$(git rev-parse origin/main)"
          int_sha="$(git rev-parse origin/integration)"
          # If integration already contains main (the normal post-rollup state), there is nothing to do --
          # this is the guard that stops the rollup<->sync pair from ping-ponging.
          if git merge-base --is-ancestor "$main_sha" "$int_sha"; then
            echo "integration (${int_sha:0:8}) already contains main (${main_sha:0:8}); nothing to sync back."
            exit 0
          fi
          echo "::warning::main (${main_sha:0:8}) has commits integration (${int_sha:0:8}) lacks -- likely a direct push to main. Merging back."
          git config user.name "seqtoid-rollup-bot"
          git config user.email "seqtoid-rollup-bot@users.noreply.github.com"
          git checkout -B integration origin/integration
          git merge --no-edit origin/main
          git push origin integration
          echo "merged main -> integration"
