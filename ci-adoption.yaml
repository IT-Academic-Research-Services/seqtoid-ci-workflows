# CI SSOT adoption manifest -- the source of truth for which platform repos use which reusable(s)
# from seqtoid-ci-workflows, and which are documented exceptions. The drift-check
# (.github/workflows/drift-check.yml + bin/drift-check.py) asserts reality matches this. Update this
# file when a repo adopts or changes a gate. See docs/DESIGN.md.
#
# SCOPE: only the repos actively enrolled in uniform CI.
#
# Per repo, each gate is one of:
#   <gate>: <path>            -> the repo MUST have a workflow calling
#                               IT-Academic-Research-Services/seqtoid-ci-workflows/<path>@... (verified
#                               by drift-check). e.g. security.yml, terraform-ci.yml, terraform-plan.yml,
#                               regression-gate.yml, flake8-action.
#   <gate>: "exception: ..."  -> intentionally kept local (reason recorded, not enforced).
#   <gate>: "review: ..."     -> posture not yet decided / adoption pending (recorded).
branch: integration            # which branch to inspect
repos:

  # ---------------- Infra (Terraform) ----------------
  seqtoid-ssot-infra:
    security:       .github/workflows/security.yml
    terraform-ci:   .github/workflows/terraform-ci.yml
    terraform-plan: "review: deferred pending per-env apply-path wiring; adopt terraform-plan.yml after."
  cypherid-web-infra:
    security:       .github/workflows/security.yml
    terraform:      "exception: richer per-component validate-stack.yml (tiered validation)."
    terraform-plan: "exception: plan-on-PR via own per-component matrix; richer than the shared reusable."
    regression:     "review: standardize the regression gate pin to @v1."
  cypherid-workflow-infra:
    terraform-ci:   .github/workflows/terraform-ci.yml
    security:       .github/workflows/security.yml
    flake8:         flake8-action
    terraform-plan: "exception: plan-on-PR via own plan_only (codegen + secrets); mirrors cypherid-web-infra."

  # ---------------- Application ----------------
  seqtoid-web:
    security:       "exception: app repo (no Terraform); app-tuned gitleaks allowlist + report-only trivy."
    flake8:         flake8-action
    regression:     "review: local regression harness; evaluate converge to the shared gate."

  # ---------------- Pipeline (WDL) ----------------
  seqtoid-workflows:
    security:       .github/workflows/security.yml
    status:         "review: canonical WDL CI; extract to shared reusables."
  swipe:
    security:       "exception: adopted security.yml@v1 on main (mirror repo, no integration branch)."
    status:         "exception: pins already modern; inherited IaC misconfigs baselined."
