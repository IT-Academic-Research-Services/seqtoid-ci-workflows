# CI SSOT adoption manifest — the source of truth for which platform repos use which reusable(s) from
# seqtoid-ci-workflows, and which are documented exceptions. The drift-check (.github/workflows/drift-check.yml
# + bin/drift-check.py) asserts reality matches this. Update this file when a repo adopts or changes a gate.
# See docs/DESIGN.md and CI-V2-AUDIT.md.
#
# SCOPE: only the repos we actively work in. Forks, sw-* clones, mis-purposed/legacy gate repos, and the
# tofu-template scaffold are intentionally OUT of the manifest (they are retire/converge candidates, tracked
# in CI-V2-AUDIT.md — not enrolled in uniform CI).
#
# Per repo, each gate is one of:
#   <gate>: <path>            -> the repo MUST have a workflow calling IT-Academic-Research-Services/seqtoid-ci-workflows/<path>@...
#                               (verified by drift-check). e.g. security.yml, terraform-ci.yml, terraform-plan.yml,
#                               regression-gate.yml, flake8-action.
#   <gate>: "exception: ..."  -> intentionally kept local (reason required) — recorded, not enforced.
#   <gate>: "review: ..."     -> posture not yet decided / adoption pending (v2 workstream tagged) — recorded.
#
# CI v2 workstreams: P0 = shared terraform-plan on PR; P1 = adopt+enforce (pins, manifest, DRIFT_STRICT);
# P2 = OpenTofu->Terraform + shared security; P3 = de-sprawl/consolidate; P4 = redundancy.
branch: integration            # which branch to inspect (adoptions live on integration until synced to main)
repos:

  # ---------------- Infra (Terraform) ----------------
  seqtoid-ssot-infra:                      # reference adopter
    security:       .github/workflows/security.yml
    terraform-ci:   .github/workflows/terraform-ci.yml
  cypherid-web-infra:
    security:       .github/workflows/security.yml
    terraform:      "exception: richer validate-stack.yml (tiered per-component validation) — uniformity would lose function"
    terraform-plan: "review: has local plan_all/plan_component (manual dispatch, saved-plan->apply) — adopt shared terraform-plan.yml on PR (P0)"
    regression:     "review: regression-gate pinned @main — standardize to @v1 (P1)"
  cypherid-workflow-infra:
    terraform-ci:   .github/workflows/terraform-ci.yml
    security:       .github/workflows/security.yml   # corrected: it already calls security.yml@v1 (was 'review')
    flake8:         flake8-action
    terraform-plan: "review: has local plan_only (manual dispatch) — adopt shared terraform-plan.yml on PR (P0)"
  czid-infra:
    security:       "review: hand-maintained LOCAL copy of the SSOT scanners — adopt security.yml@v1 (P2)"
    terraform-ci:   "review: local OpenTofu tofu-ci.yml (validate-only) — revert to Terraform + adopt terraform-ci.yml@v1 (P2)"
    terraform-plan: "review: no plan gate — add shared terraform-plan.yml (P0, after the read-only plan role exists)"

  # ---------------- Application ----------------
  seqtoid-web:                             # reference app pipeline
    security:       "exception: app repo (no Terraform); app-tuned gitleaks allowlist + report-only trivy"
    flake8:         flake8-action
    regression:     "review: local regression via ssot-infra platform-harness (not the shared regression-gate.yml) — evaluate converge"

  # ---------------- Pipeline (WDL) ----------------
  seqtoid-workflows:                       # canonical WDL CI
    security:       .github/workflows/security.yml   # corrected: it already calls security.yml@v1 (was 'no security gates yet')
    status:         "review: canonical WDL CI (wdl-ci, short-read-mngs benchmarks, cargo) — extract to shared reusables (P3)"
  swipe:
    security:       "review: no security gate — adopt security.yml@v1 (P4)"
    status:         "review: legacy standalone (checkout@v2, ubuntu-20.04, no resilience) — modernize pins + adopt shared gates, or retire (P4)"
